<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRINT AI v3.0</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { color: #00f2ff; text-shadow: 0 0 20px rgba(0,242,255,0.3); margin-bottom: 5px; }
        .sub { color: #666; font-size: 0.85em; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; width: 100%; max-width: 1000px; }
        .card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 25px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        .card h2 { color: #00f2ff; font-size: 1.1em; margin-bottom: 15px; border-bottom: 1px solid #222; padding-bottom: 10px; }
        input, button { width: 100%; padding: 12px; margin: 6px 0; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 8px; font-size: 14px; }
        button { background: #00f2ff; color: #000; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { box-shadow: 0 0 15px rgba(0,242,255,0.4); }
        .out { background: #000; padding: 15px; border-radius: 8px; margin-top: 12px; min-height: 24px; border-left: 3px solid #00f2ff; font-family: monospace; font-size: 0.9em; word-break: break-all; }
    </style>
</head>
<body>
    <h1>🧠 PRINT AI v3.0</h1>
    <div class="sub">Self-Aware Neural Network | Identity Vector | Persistent Memory</div>
    
    <div class="grid">
        <div class="card">
            <h2>🔮 Предсказание</h2>
            <input type="number" id="p1" placeholder="Вход X1" step="0.1">
            <input type="number" id="p2" placeholder="Вход X2" step="0.1">
            <button onclick="predict()">ДУМАТЬ</button>
            <div class="out" id="po">Ожидание...</div>
        </div>
        
        <div class="card">
            <h2> Обучение</h2>
            <input type="number" id="t1" placeholder="Вход X1" step="0.1">
            <input type="number" id="t2" placeholder="Вход X2" step="0.1">
            <input type="number" id="tt" placeholder="Цель" step="0.1">
            <input type="number" id="te" placeholder="Эпохи" value="300">
            <button onclick="train()">ОБУЧИТЬ</button>
            <div class="out" id="to">Готов к обучению</div>
        </div>
        
        <div class="card">
            <h2>👤 Личность</h2>
            <button onclick="who()">КТО ТЫ?</button>
            <div class="out" id="wo">Нажми кнопку</div>
        </div>
        
        <div class="card">
            <h2>💾 Память</h2>
            <input type="text" id="rm" placeholder="Запомни факт...">
            <button onclick="remember()">ЗАПОМНИТЬ</button>
            <div class="out" id="mo">Память пуста</div>
        </div>
    </div>

    <script>
        // ⚠️ ВАЖНО: ЗАМЕНИ ЭТОТ IP НА IP ТВОЕГО ПЛАНШЕТА!
        const SERVER_IP = '192.168.100.4'; 
        const S = `http://${SERVER_IP}:8080`;
        
        async function req(action, body={}) {
            try {
                const r = await fetch(S, {
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({action, ...body})
                });
                return await r.json();
            } catch(e) { 
                document.getElementById('wo').innerText = '❌ Нет связи с сервером. Проверь IP.'; 
                return null; 
            }
        }
        
        async function predict() {
            const d = await req('predict', {
                input: [[parseFloat(document.getElementById('p1').value)||0, parseFloat(document.getElementById('p2').value)||0]]
            });
            if(d) document.getElementById('po').innerHTML = `Результат: ${d.result}<br><span style="color:#555">${d.name}: ${d.purpose}</span>`;
        }
        
        async function train() {
            document.getElementById('to').innerText = 'Обучение...';
            const d = await req('train', {
                input: [[parseFloat(document.getElementById('t1').value)||0, parseFloat(document.getElementById('t2').value)||0]], 
                target: [[parseFloat(document.getElementById('tt').value)||0]], 
                epochs: parseInt(document.getElementById('te').value)||300
            });
            if(d) document.getElementById('to').innerText = `✅ Обучено!\nПотеря: ${d.loss}`;
        }
        
        async function who() {
            const d = await req('who');
            if(d) document.getElementById('wo').innerHTML = `Имя: ${d.name}<br>Версия: ${d.version}<br>Цель: ${d.purpose}<br>Тон: ${d.tone}<br>Записей в памяти: ${d.mem}`;
        }
        
        async function remember() {
            const msg = document.getElementById('rm').value.trim();
            if(!msg) return;
            const d = await req('remember', {msg});
            if(d) { 
                document.getElementById('mo').innerText = `✅ Сохранено! Всего записей: ${d.total}`; 
                document.getElementById('rm').value = ''; 
            }
        }
    </script>
</body>
</html>
